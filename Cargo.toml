[package]
name = "kugou-tui"
version = "0.4.1"
edition = "2024"
# 1.86 是 ratatui-image 11.x 的下限：它要 ratatui 0.30，而支持 ratatui 0.30 的
# ratatui-image 最低是 10.0.0，MSRV 就是 1.86。不能退回 8.x——8.x 只认
# ratatui 0.29，会和这里的 0.30 编出两份 ratatui（且不兼容，渲染不进同一个 Frame）。
rust-version = "1.86"
description = "轻量级酷狗音乐命令行 TUI 播放器，基于 KuGouMusicApi"
license = "MIT"
repository = "https://github.com/sijin-xb/kugou-tui"
keywords = ["tui", "music", "kugou", "player", "cli"]
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "kugou-tui"
path = "src/main.rs"

[dependencies]
# --- TUI ---
# 只依赖 ratatui，crossterm 通过 ratatui::crossterm 复用，避免版本错配
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    "crossterm_0_29",
    "all-widgets",
    "layout-cache",
    "underline-color",
] }

# --- 异步运行时（仅用于网络 IO） ---
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "time",
    "fs",
    "io-util",
    "sync",
] }

# --- HTTP ---
# 关闭默认 feature 以剔除 native-tls / system-proxy，改用 rustls，减小体积
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "query",
    "gzip",
    "stream",
    "http2",
    "charset",
] }

# --- 音频解码与播放 ---
# 关闭 default 以剔除 recording（录音，不需要）与 dither（抖动，额外引入 rand）
rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "mp3",
    "flac",
    "mp4",
    "vorbis",
    "wav",
] }

# --- 封面图片解码 ---
# 只开 jpeg / png：酷狗的封面基本就这两种格式，
# 关掉默认特性可以少拖进来一大堆编码器与并行依赖
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# --- 序列化 ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# --- 本地日期 ---
# 只用来算「今天是几号」：领取概念版 VIP 要传本地日期，而 UTC 日期在凌晨那几个
# 小时还停在昨天（见 `util::today_local`）。不用 chrono——只要一个 YYYY-MM-DD，
# 为它拉一整个日期库不划算。`time` 本来就在依赖树里（local-offset 已被启用），
# 这里不引入新编译。
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }

# --- 错误处理 ---
thiserror = "2"
anyhow = "1"

# --- 基础设施 ---
dirs = "7"
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.23"
crossbeam-channel = "0.5"
qrcode = { version = "0.14.1", default-features = false }
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }

# 只为了 `dup2`：把 stderr 接到日志文件上，免得音频后端（libjack / libasound）
# 的报错打在 TUI 画面上。它本来就在依赖树里（alsa → cpal → rodio），
# 显式声明不增加任何编译量。
libc = "0.2"

# --- 终端图片（封面）---
# 关掉默认的 image-defaults：那会打开 image 的全部格式解码器并拖进 rayon，
# 和本项目「只开 jpeg / png」的取舍冲突。crossterm 是探测终端能力所必需的。
ratatui-image = { version = "11.1.0", default-features = false, features = [
    "crossterm",
] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
