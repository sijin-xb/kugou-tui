<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 连尾双音符（♫）。白色填充 + 深色描边：深色面板上白符身可见，浅色面板上描边兜底。
       两个 <use> 叠出描边效果：先画一遍粗描边、再原位叠一遍纯填充。 -->
  <defs>
    <g id="note" fill="#ffffff">
      <ellipse cx="20" cy="49" rx="9.5" ry="6.5" transform="rotate(-18 20 49)"/>
      <rect x="26" y="16" width="5" height="33" rx="2.5"/>
      <polygon points="26,16 55,12 55,20.5 26,24.5"/>
      <ellipse cx="44" cy="45" rx="9.5" ry="6.5" transform="rotate(-18 44 45)"/>
      <rect x="50" y="12" width="5" height="33" rx="2.5"/>
    </g>
  </defs>
  <use href="#note" stroke="#0a0d12" stroke-opacity="0.55" stroke-width="5.5" stroke-linejoin="round"/>
  <use href="#note"/>
</svg>
