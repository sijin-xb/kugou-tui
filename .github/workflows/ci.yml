# 持续集成。
#
# # 为什么 Windows 这一栏是重点
#
# 「能不能在 Windows 上跑」不是读代码能确认的事：路径展开（`~`）、配置目录、
# 缓存文件命名、stderr 重定向这些都在**运行时**才露出来，而开发机是 Linux，
# 光靠 `cargo check` 只能保证编得过。所以这里让两个平台各真的跑一遍测试。
#
# 这也是这套 CI 存在的意义：Windows 支持是后加的，没有回归网的话，下一次改动
# 很容易在不知不觉中把它弄坏（改一行 `std::os::unix`、加一个只认 `HOME` 的路径
# 拼接就够了）。
#
# # 为什么还有 macOS 这一栏
#
# macOS 在代码里走的是 `cfg(unix)` 分支，和 Linux 共用绝大多数平台代码，
# 但**共用不等于验证过**：`dirs` 在那边给的是 `~/Library/...` 而不是 XDG 目录，
# 音频后端是 CoreAudio 而不是 ALSA，字体探测拿不到 `fc-list`。这些差异只有在
# 那边真的跑一遍测试才看得见。没有这一栏，README 上就只能写「理论可用」。
#
# # 这里**只做验证**，不产出任何发行资产
#
# 三栏跑的都是 clippy + test，**不跑 `cargo build --release`、不打发行包、
# 不传 artifact**。原因：
#
#   * release 构建带 `lto = "fat"` 与 `codegen-units = 1`，每次推送为三个平台
#     各跑一遍要好几倍的时间，而**产物没有任何人用**——要下载二进制的人应该去
#     Releases 页，那里有正式资产；
#   * 打发行包那份工作 `release.yml` 在打 tag 时已经完整做过一遍，这里再做
#     属于重复；
#   * 「推 tag 之前先验证打包脚本」这个顾虑，由 `scripts/release` 的**阶段一**
#     兜住——它本来就会在本机跑完 `make-release-tarball` 并停下来等确认，
#     所以推 tag 之前一样看得见打包结果。CI 那份是重复的第二次。
#
# 简言之：**发行资产只由 `release.yml` 在发版时产出**，CI 负责「能不能合入」。
#
# # 本地等价命令
#
# 见 `CONTRIBUTING.md`「提交前请跑这三条」与 `docs/MAINTENANCE.md` §1.6。
# `cargo fmt --check` 只在 Linux 那一栏跑：格式化与平台无关，三栏各跑一遍是浪费。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时取消前一次，省额度也省得看一堆过期结果。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cpal 在 Linux 上走 ALSA，`alsa-sys` 的构建脚本要靠 pkg-config 找到
      # alsa-lib 的开发头文件。开发机上这两个是现成的，干净的 CI 容器里不是。
      - name: 装音频后端依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # 格式化与平台无关，只在 Linux 这一栏查一遍。
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      # 关掉默认 feature 的那套组合也编一遍。它换掉整个 bootstrap 模块
      # （走 `src/bootstrap_disabled.rs` 的替身），是最容易在后续改动里
      # 悄悄编不过的组合——而它恰恰是「不想让二进制带 Node 引导」的人用的。
      # 与 fmt 同理：feature 组合与平台无关，只在 Linux 这一栏查。
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # **不需要**装 CMake / NASM / OpenSSL：Windows 的 TLS 走系统自带的
      # SChannel 而不是 rustls，所以 aws-lc-sys 那坨 C 代码根本不参与编译。
      # 这正是 `Cargo.toml` 里把 TLS 后端按平台分叉的目的，见那两段注释。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # 什么都不用装：Xcode 命令行工具（clang）与 cmake 都在 runner 镜像里，
      # `aws-lc-sys` 那坨 C 代码因此编得过。macOS 没有 ALSA 那套依赖。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
