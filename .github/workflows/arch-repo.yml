name: Arch repo

# 打 tag 时构建 .pkg.tar.zst，更新 pacman 索引，推到 sijin-xb/kugou-tui-repo 的 gh-pages。
#
# 与 release.yml 并列而不是合并进去：那边只碰本仓库的 Release，这边要写另一个仓库。
# 分开之后任何一边失败都不影响另一边，也免得给 release.yml 加跨仓库凭据。
#
# 需要的 secret：ARCH_REPO_TOKEN —— 对 sijin-xb/kugou-tui-repo 有 contents:write 的
# fine-grained PAT。GITHUB_TOKEN 只对当前仓库有效，跨仓库推送用不了。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要补包的 tag（例如 v0.8.1）'
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  REPO_SLUG: sijin-xb/kugou-tui-repo
  # 保留多少个历史版本。Pages 站点有 1 GB 软限制，单包约 5 MB，
  # 留 20 个版本约 100 MB，够用且远未触顶。
  KEEP_VERSIONS: '20'

jobs:
  build:
    name: 构建 Arch 包
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      # tag 名会进 checkout 的 ref。workflow_dispatch 的输入不受控，
      # 先用一条白名单校验挡住 `refs/heads/../../` 这类路径穿越。
      - name: 校验 tag
        env:
          TAG_IN: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG_IN" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag 格式不对：$TAG_IN" >&2; exit 1 ;;
          esac
          case "$TAG_IN" in
            *[!A-Za-z0-9._-]*) echo "tag 含非法字符：$TAG_IN" >&2; exit 1 ;;
          esac

      # checkout main 而不是 tag。
      #
      # PKGBUILD 是构建脚本，会随打包方式调整而改；它不该被冻结在某个历史 tag 里。
      # 版本号由下面的「注入 pkgver」从 tag 写进去，所以打出来的包版本仍然正确。
      # 早先 checkout tag 时，v0.8.1 那次提交里根本没有 packaging/，直接 cd 失败。
      #
      # fetch-depth: 0 要完整历史：makepkg 的 source= 用 v$pkgver 拉 tag 归档，
      # 不需要本地 tag，但 git archive 之外的兜底路径需要。留着更稳。
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 把 tag 的版本号写进 PKGBUILD。tag 是 v0.8.1，pkgver 要变成 0.8.1。
      - name: 注入 pkgver
        env:
          TAG_IN: ${{ inputs.tag || github.ref_name }}
        run: |
          cd "$GITHUB_WORKSPACE/packaging/arch"
          ver="${TAG_IN#v}"
          sed -i "s/^pkgver=.*/pkgver=$ver/" PKGBUILD
          echo "pkgver 已设为 $ver"
          grep '^pkgver=' PKGBUILD

      # makepkg 拒绝以 root 运行（它要调 pacman -U 装依赖，root 下会污染构建环境）。
      # 容器里默认只有 root，所以建一个 builder 用户，构建目录 chown 给它。
      - name: 准备构建用户
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel alsa-lib pkgconf cmake cargo git
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # 缓存 cargo 的 registry 与 target。
      #
      # 路径用 /home/builder：sudo -H 会把 HOME 重置成目标用户的家目录，
      # 所以 cargo 的缓存在那里。不要用 $HOME——容器里它是 /github/home，
      # 那是 Actions 挂载的，builder 无写权限。
      #
      # makepkg --cleanbuild 会删掉 src/（里面是 target/），所以 CARGO_TARGET_DIR
      # 必须指到 src/ 之外，否则缓存每轮都被清掉。
      #
      # key 里带 Cargo.lock 的哈希：依赖变了就换一份缓存，避免拿到过期产物。
      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
            /home/builder/.cache/kugou-tui-cargo-target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 把缓存目录交给 builder
        run: |
          # 缓存未命中时 actions/cache 不创建目录，builder 也还没跑过 cargo，
          # 所以两个目录都得先建出来再 chown。
          mkdir -p /home/builder/.cargo/registry /home/builder/.cargo/git \
                   /home/builder/.cache/kugou-tui-cargo-target
          chown -R builder:builder /home/builder/.cargo /home/builder/.cache

      # --syncdeps 让 makepkg 自己装 depends/makedepends；--cleanbuild 保证不复用
      # 上一次的 src/ 与 pkg/；--noconfirm 跳过交互。
      #
      # 不传 --skippgpcheck：这个 PKGBUILD 没有 PGP 源。
      #
      # 用 cd "$GITHUB_WORKSPACE" 而不是 working-directory：在 container job 里
      # working-directory 会被当成容器启动时的 cwd，而那时 checkout 还没跑，
      # 目录不存在，容器直接 chdir 失败。$GITHUB_WORKSPACE 在 step 执行期才求值。
      - name: 构建
        env:
          # 指向 src/ 之外，--cleanbuild 删 src/ 时才不会把编译缓存一起清掉。
          CARGO_TARGET_DIR: /home/builder/.cache/kugou-tui-cargo-target
        run: |
          cd "$GITHUB_WORKSPACE/packaging/arch"
          # -H 把 HOME 重置成 /home/builder，否则 cargo 会去写 /github/home/.cargo
          # （Actions 挂载的目录，builder 无权限）。-E 保留 CARGO_TARGET_DIR。
          sudo -H -E -u builder makepkg --syncdeps --cleanbuild --noconfirm --force

      # 核对构建出的二进制自报版本，而不是 PKGBUILD 里的字符串——后者是上一步
      # 刚注入的，比对它等于自己跟自己比，抓不到「源码 checkout 错了」这类问题。
      #
      # 从打好的包里取二进制而不是 src/：makepkg 的中间目录结构不是稳定接口，
      # 而包的布局是。用 bsdtar 直接从 .pkg.tar.zst 里读，不安装。
      - name: 核对版本
        run: |
          cd "$GITHUB_WORKSPACE/packaging/arch"
          expected="${TAG#v}"
          pkgfile=$(ls -1 ./*.pkg.tar.zst | head -1)
          bsdtar -xOf "$pkgfile" usr/bin/kugou-tui > /tmp/kugou-tui-check
          chmod +x /tmp/kugou-tui-check
          actual=$(/tmp/kugou-tui-check --version | awk '{print $NF}')
          [ "$actual" = "$expected" ] ||
            { echo "包内二进制自报 $actual，tag 是 $expected" >&2; exit 1; }
          echo "版本核对通过：$actual（来自 $pkgfile）"

      - name: 收集产物
        run: |
          mkdir -p /tmp/out
          cp "$GITHUB_WORKSPACE"/packaging/arch/*.pkg.tar.zst /tmp/out/
          cp "$GITHUB_WORKSPACE"/packaging/arch/install.sh /tmp/out/
          ls -lh /tmp/out

      - uses: actions/upload-artifact@v4
        with:
          name: arch-pkg
          path: /tmp/out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 更新仓库索引并推送
    needs: build
    runs-on: ubuntu-latest
    # repo-add 是 pacman 自带的工具，ubuntu runner 上没有。整个 job 放进 Arch
    # 容器，和 build 用同一个镜像，省得去猜别的发行版怎么装 pacman-contrib。
    container:
      image: archlinux:latest
    steps:
      - name: 装 git 与 pacman 工具
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git pacman

      - name: 取回产物
        uses: actions/download-artifact@v4
        with:
          name: arch-pkg
          path: ${{ github.workspace }}/pkg

      # 检出已有的 gh-pages，保留历史包。浅克隆够用：只需要现有文件。
      #
      # token 通过环境变量传，不拼进 URL 字面量：拼进去会出现在进程命令行里，
      # 出错时 git 也可能把整个 remote URL 打进日志。
      #
      # 容器 job 的 cwd 是 /，所以 site 建在 $GITHUB_WORKSPACE 下，
      # 后续步骤都用绝对路径进去。
      - name: 检出 gh-pages
        env:
          ARCH_REPO_TOKEN: ${{ secrets.ARCH_REPO_TOKEN }}
          REPO_SLUG: ${{ env.REPO_SLUG }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          remote="https://x-access-token:${ARCH_REPO_TOKEN}@github.com/${REPO_SLUG}.git"
          export GIT_TERMINAL_PROMPT=0
          if git clone --depth 1 --branch gh-pages "$remote" site 2>/dev/null; then
            echo "已检出现有 gh-pages"
          else
            # 首次发布时分支还不存在，从空仓库起。
            rm -rf site
            git init site
            git -C site remote add origin "$remote"
            git -C site checkout -b gh-pages
          fi

      - name: 更新索引
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/site"
          mkdir -p x86_64
          # 只收主包，排除 -debug 与任何附带产物。PKGBUILD 里已加 !debug，
          # 这里再挡一道：repo-add 一旦收录 -debug，pacman 的 -S kugou-tui
          # 会连它一起拉，用户多下 4 KB 空包还看到一条莫名其妙的记录。
          for f in "$GITHUB_WORKSPACE"/pkg/*.pkg.tar.zst; do
            case "$(basename "$f")" in
              *-debug-*) echo "跳过 $(basename "$f")"; continue ;;
            esac
            cp "$f" x86_64/
          done
          cp "$GITHUB_WORKSPACE"/pkg/install.sh install.sh
          # .nojekyll 关掉 Jekyll：否则 x86_64 目录与 .pkg.tar.zst 会被它的
          # 规则过滤掉。
          touch .nojekyll
          # repo-add 在 x86_64/ 下运行，索引里的条目是相对文件名，
          # pacman 用 Server 行拼出来能对上。
          cd x86_64
          # 清掉上一轮留下的 -debug 包与 repo-add 的 .old 备份。这两个都是
          # 历史残留，不删会一直挂在仓库里。
          rm -f -- *-debug-*.pkg.tar.zst *.old
          repo-add --nocolor kugou-tui.db.tar.gz ./*.pkg.tar.zst

      - name: 清理旧版本
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/site/x86_64"
          # 按版本排序，删掉超出 KEEP_VERSIONS 的最旧包。
          # 文件名形如 kugou-tui-0.8.1-1-x86_64.pkg.tar.zst。
          #
          # 只数主包：-debug 若混进来会把计数撑大，导致主包被提前删掉。
          # grep 无匹配时返回 1，在 pipefail 下会让整个 step 失败，所以补 || true。
          mapfile -t all < <(ls -1 *.pkg.tar.zst 2>/dev/null | grep -v -- '-debug-' | sort -V || true)
          count=${#all[@]}
          if [ "$count" -gt "$KEEP_VERSIONS" ]; then
            remove=$(( count - KEEP_VERSIONS ))
            printf '删除 %d 个旧包：\n' "$remove"
            for f in "${all[@]:0:$remove}"; do
              echo "  $f"
              rm -f "$f"
            done
          fi
          # 索引要跟着重建，否则 pacman 还能看到已删除的包。
          rm -f kugou-tui.db.tar.gz kugou-tui.db *.old
          repo-add --nocolor kugou-tui.db.tar.gz ./*.pkg.tar.zst

      - name: 推送
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/site"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交。"
            exit 0
          fi
          git commit -m "kugou-tui ${TAG#v}"
          git push origin gh-pages
