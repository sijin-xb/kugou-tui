# 发行资产：在打 tag 时把 Windows 与 macOS 的二进制挂到 GitHub Release 上。
#
# # 为什么需要它
#
# 发版流程（`scripts/release`）跑在开发机上，而那是 Linux——它只能产出
# `x86_64-unknown-linux-gnu` 的 tarball。Windows 的 `.exe` 必须在 Windows 上编
# （MSVC 工具链），macOS 的二进制必须在 macOS 上编（Apple SDK）。所以这两个平台
# 的包只能交给 CI。这个工作流就是干这件事的。
#
# Linux 不在这里重复构建：`scripts/release` 已经在本地编好、验好、传上去了
# （它还会核对资产内容）。这里只补开发机产不出来的那两个。
#
# # 触发
#
# * 推 `v*` tag —— 发版流程的正常路径；
# * `workflow_dispatch` 手动指定 tag —— 给**已经发过**的版本补资产用
#   （比如 0.4.2 发布时这个工作流还不存在）。
#
# # 时序
#
# 本地 `scripts/release` 的顺序是「推 tag → 建 Release」，而 tag 一推这个工作流
# 就起来了——所以上传前必须**等 Release 出现**，不能直接 upload。见下面的重试。

name: Release assets

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要补资产的 tag（例如 v0.4.2）'
        required: true
        type: string

# `gh release upload` 要写权限。默认的 GITHUB_TOKEN 是只读的。
permissions:
  contents: write

env:
  # tag 推送时用 `github.ref_name`；手动触发时用它给的输入。
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows 包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # 不需要 CMake / NASM / OpenSSL：Windows 的 TLS 走系统 SChannel，
      # 见 Cargo.toml 里 cfg(windows) 的注释。
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release

      # 校验编出来的确实是要发的那个版本——checkout 错了 ref 时这条能拦住。
      - name: 校验版本号
        shell: pwsh
        run: |
          $expected = "$env:TAG".TrimStart('v')
          $actual = (.\target\release\kugou-tui.exe --version).Split(' ')[-1]
          if ($actual -ne $expected) {
            throw "二进制自报 $actual，tag 是 $expected —— checkout 的 ref 不对"
          }
          Write-Host "版本核对通过：$actual"

      - name: 打包
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipBuild

      # 用 bash 而不是 pwsh：两个平台共用同一个上传脚本，逻辑只有一份
      # （Windows runner 上的 `shell: bash` 就是 Git Bash）。
      - name: 挂到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/upload-release-asset "$TAG" 'dist/*.zip'

  macos:
    name: macOS 包
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # 什么都不用装：Xcode 命令行工具（clang）与 cmake 都在 runner 镜像里，
      # `aws-lc-sys` 那坨 C 代码因此编得过。macOS 没有 ALSA 那套依赖。
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release

      - name: 校验版本号
        run: |
          expected="${TAG#v}"
          actual=$(./target/release/kugou-tui --version | awk '{print $NF}')
          [ "$actual" = "$expected" ] ||
            { echo "二进制自报 $actual，tag 是 $expected —— checkout 的 ref 不对" >&2; exit 1; }
          echo "版本核对通过：$actual"

      # 用仓库里那个脚本，不在这里现拼目录：发行包必须同时带上三个 bash 脚本与
      # docs/，手工拼很容易漏（0.3.7 那版就漏了）。它已经在 macOS 上跑得通
      # ——`readlink -f` 与 `sha256sum` 这两处 GNU 专有的东西都换掉了。
      - name: 打包
        run: ./scripts/make-release-tarball

      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/upload-release-asset "$TAG" 'dist/*.tar.gz'
